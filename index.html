<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Log</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--done:#0f766e;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:28px;margin:0 0 4px}.date,.sub,.note{color:var(--muted)}.date{font-size:14px}.sub,.note{font-size:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
button,input,select{font:inherit}.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px}
.timer{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:10;background:#111827;color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.timer.hidden{display:none}.time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.timer button{border:0;background:#fff;border-radius:10px;padding:8px 10px}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}.box,.card,.settings{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.box .v{font-size:20px;font-weight:800}.box .k{font-size:11px;color:var(--muted)}
.card{margin-bottom:10px}.card.done{border-color:#99d5cd;background:#f2fbf9}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:17px;font-weight:750}.badge{font-size:12px;background:#f3f4f6;padding:5px 8px;border-radius:999px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px 2px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;min-height:44px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.setbtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 5px;font-weight:700}.setbtn.completed{background:var(--done);border-color:var(--done);color:#fff}
.runbtn,.primary{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:12px;font-weight:800;margin-top:10px}.actions{display:flex;gap:8px;margin-top:10px}.small{border:0;background:transparent;color:var(--muted);padding:5px 0;font-size:12px}.danger{color:var(--danger)}
.panel{display:none}.panel.active{display:block}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px}.nav button{flex:1;border:0;background:transparent;border-radius:12px;padding:11px;font-weight:700;color:var(--muted)}.nav .active{background:#111827;color:#fff}
.settings{margin-bottom:12px}.settings h2{font-size:17px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row input,.row select{max-width:150px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.machine-row{display:grid;grid-template-columns:1fr 82px 36px;gap:7px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.machine-row input,.machine-row select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.delete{border:0;background:transparent;color:var(--danger);font-size:20px}
.history-date{font-size:13px;color:var(--muted);margin:18px 2px 7px}.history-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}.history-item strong{display:block}.history-item small{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:35px}
</style>
</head>
<body><div class="app">
<section id="today" class="panel active">
<div class="top"><div><h1>Gym Log</h1><div id="date" class="date"></div></div><button id="wake" class="ghost">画面を保持</button></div>
<div id="timer" class="timer hidden"><div><div class="sub" style="color:#bbb">インターバル</div><div id="time" class="time">01:30</div><div id="timerName" class="sub" style="color:#ccc"></div></div><button id="stopTimer">終了</button></div>
<div class="summary"><div class="box"><div id="setSummary" class="v">0/0</div><div class="k">完了セット</div></div><div class="box"><div id="machineSummary" class="v">0/0</div><div class="k">完了マシン</div></div><div class="box"><div id="runSummary" class="v">—</div><div class="k">ランニング</div></div></div>
<div id="list"></div>
<div class="card"><div class="head"><div><div class="name">ランニング</div><div class="sub">時間・距離を記録</div></div><div id="runBadge" class="badge">未実施</div></div><div class="fields"><div class="field"><label>時間（分）</label><input id="runMin" type="number" inputmode="numeric"></div><div class="field"><label>距離（km・任意）</label><input id="runKm" type="number" inputmode="decimal" step=".1"></div></div><button id="saveRun" class="runbtn">ランニングを記録</button></div>
</section>

<section id="history" class="panel"><div class="top"><div><h1>履歴</h1><div class="date">端末内に保存</div></div></div><div id="historyList"></div></section>

<section id="settings" class="panel"><div class="top"><div><h1>設定</h1><div class="date">メニューと休憩時間</div></div></div>
<div class="settings"><h2>インターバル</h2><div class="row"><span>全マシン共通</span><select id="rest"><option value="60">60秒</option><option value="90">90秒</option><option value="120">120秒</option><option value="180">180秒</option></select></div><p class="note">主種目・副種目の区別はありません。</p></div>
<div class="settings"><h2>実施マシン</h2><div id="machineSettings"></div><button id="addMachine" class="primary">＋ マシンを追加</button><p class="note">セット数はマシンごとに変更できます。新規追加時は3セットです。</p></div>
<div class="settings"><h2>データ</h2><div class="row"><button id="export" class="ghost">JSONを書き出す</button></div><div class="row"><button id="clear" class="ghost danger">全履歴を削除</button></div></div>
</section>
</div>
<nav class="nav"><button data-p="today" class="active">今日</button><button data-p="history">履歴</button><button data-p="settings">設定</button></nav>
<script>
const DEFAULTS=["レッグプレス","レッグカール","コンバージングチェストプレス","ダイバージングラットプルダウン","ダイバージングシーテッドロー","ショルダープレス","リアデルト","アウターサイ","アブドミナル","ダンベルカール"].map((name,i)=>({id:"m"+i,name,sets:3}));
const DK="gymLogDataV2", MK="gymLogMachinesV2", SK="gymLogSettingsV2", TK="gymLogTimerV2";
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}; const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function machines(){return load(MK,DEFAULTS)} function dateKey(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function fmt(k){let [y,m,d]=k.split("-").map(Number);return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date(y,m-1,d))}
function data(){return load(DK,{days:{}})}
function ensure(d){let k=dateKey();d.days[k]??={exercises:{},running:null};machines().forEach(m=>{let x=d.days[k].exercises[m.id];if(!x)x=d.days[k].exercises[m.id]={name:m.name,sets:[]};x.name=m.name;while(x.sets.length<m.sets)x.sets.push({done:false,weight:"",reps:""});if(x.sets.length>m.sets)x.sets.length=m.sets});return d.days[k]}
function previous(d,id){for(let k of Object.keys(d.days).sort().reverse()){if(k===dateKey())continue;let x=d.days[k]?.exercises?.[id];if(x?.sets?.some(s=>s.done)){let s=x.sets.find(s=>s.done&&(s.weight!==""||s.reps!==""));return s||{weight:"",reps:""}}}return null}
function startTimer(name){let sec=Number(load(SK,{rest:90}).rest||90);save(TK,{end:Date.now()+sec*1000,name});tick()}
function tick(){let t=load(TK,null),box=document.getElementById("timer");if(!t){box.classList.add("hidden");return}let r=Math.max(0,Math.ceil((t.end-Date.now())/1000));document.getElementById("time").textContent=`${String(Math.floor(r/60)).padStart(2,"0")}:${String(r%60).padStart(2,"0")}`;document.getElementById("timerName").textContent=t.name+(r===0?"：休憩終了":"");box.classList.remove("hidden")}
function render(){
 let d=data(),day=ensure(d);save(DK,d);document.getElementById("date").textContent=fmt(dateKey());let list=document.getElementById("list");list.innerHTML="";let ts=0,ds=0,dm=0;
 machines().forEach(m=>{let x=day.exercises[m.id],done=x.sets.filter(s=>s.done).length;ts+=m.sets;ds+=done;if(done===m.sets)dm++;let p=previous(d,m.id);let c=document.createElement("div");c.className="card"+(done===m.sets?" done":"");
 c.innerHTML=`<div class="head"><div><div class="name">${m.name}</div><div class="sub">${p?`前回 ${p.weight||"—"}kg / ${p.reps||"—"}回`:"前回記録なし"}</div></div><div class="badge">${done}/${m.sets}セット</div></div><div class="fields"><div class="field"><label>重量（kg）</label><input data-w type="number" inputmode="decimal" step=".5"></div><div class="field"><label>回数</label><input data-r type="number" inputmode="numeric"></div></div><div class="sets" style="grid-template-columns:repeat(${Math.min(m.sets,4)},1fr)">${x.sets.map((s,i)=>`<button class="setbtn ${s.done?"completed":""}" data-i="${i}">${s.done?"✓ ":""}${i+1}</button>`).join("")}</div>`;
 let w=c.querySelector("[data-w]"),r=c.querySelector("[data-r]"),last=[...x.sets].reverse().find(s=>s.done&&(s.weight!==""||s.reps!==""));w.value=last?.weight??p?.weight??"";r.value=last?.reps??p?.reps??"";
 c.querySelectorAll(".setbtn").forEach(b=>b.onclick=()=>{let dd=data();ensure(dd);let s=dd.days[dateKey()].exercises[m.id].sets[+b.dataset.i];if(s.done)s.done=false;else{s.done=true;s.weight=w.value;s.reps=r.value;s.at=Date.now();if(+b.dataset.i<m.sets-1)startTimer(m.name)}save(DK,dd);render()});list.appendChild(c)});
 document.getElementById("setSummary").textContent=`${ds}/${ts}`;document.getElementById("machineSummary").textContent=`${dm}/${machines().length}`;let run=day.running;document.getElementById("runMin").value=run?.minutes??"";document.getElementById("runKm").value=run?.distance??"";document.getElementById("runBadge").textContent=run?`${run.minutes}分`:"未実施";document.getElementById("runSummary").textContent=run?`${run.minutes}分`:"—";renderMachineSettings();renderHistory()
}
function renderMachineSettings(){let wrap=document.getElementById("machineSettings");wrap.innerHTML="";machines().forEach((m,i)=>{let row=document.createElement("div");row.className="machine-row";row.innerHTML=`<input value="${m.name.replaceAll('"','&quot;')}" aria-label="マシン名"><select aria-label="セット数">${[1,2,3,4,5,6].map(n=>`<option ${n===m.sets?"selected":""}>${n}</option>`).join("")}</select><button class="delete">×</button>`;let inp=row.querySelector("input"),sel=row.querySelector("select");inp.onchange=()=>{let a=machines();a[i].name=inp.value.trim()||a[i].name;save(MK,a);render()};sel.onchange=()=>{let a=machines();a[i].sets=+sel.value;save(MK,a);render()};row.querySelector(".delete").onclick=()=>{if(confirm(`「${m.name}」をメニューから削除しますか？\n過去の履歴は残ります。`)){let a=machines();a.splice(i,1);save(MK,a);render()}};wrap.appendChild(row)})}
function renderHistory(){let d=data(),w=document.getElementById("historyList");w.innerHTML="";let any=false;for(let k of Object.keys(d.days).sort().reverse()){let day=d.days[k],items=Object.values(day.exercises||{}).filter(x=>x.sets?.some(s=>s.done));if(!items.length&&!day.running)continue;any=true;let h=document.createElement("div");h.className="history-date";h.textContent=fmt(k);w.appendChild(h);items.forEach(x=>{let q=document.createElement("div");q.className="history-item";q.innerHTML=`<strong>${x.name}</strong><small>${x.sets.filter(s=>s.done).map((s,i)=>`${i+1}: ${s.weight||"—"}kg × ${s.reps||"—"}回`).join(" / ")}</small>`;w.appendChild(q)});if(day.running){let q=document.createElement("div");q.className="history-item";q.innerHTML=`<strong>ランニング</strong><small>${day.running.minutes}分${day.running.distance!==""?` / ${day.running.distance}km`:""}</small>`;w.appendChild(q)}}if(!any)w.innerHTML='<div class="empty">まだ履歴がありません。</div>'}
document.getElementById("saveRun").onclick=()=>{let min=document.getElementById("runMin").value;if(min==="")return;let d=data();ensure(d);d.days[dateKey()].running={minutes:+min,distance:document.getElementById("runKm").value===""?"":+document.getElementById("runKm").value};save(DK,d);render()};
document.getElementById("addMachine").onclick=()=>{let name=prompt("追加するマシン名");if(!name?.trim())return;let a=machines();a.push({id:"m_"+Date.now(),name:name.trim(),sets:3});save(MK,a);render()};
let st=load(SK,{rest:90});document.getElementById("rest").value=String(st.rest);document.getElementById("rest").onchange=e=>save(SK,{rest:+e.target.value});
document.getElementById("stopTimer").onclick=()=>{localStorage.removeItem(TK);tick()};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.p).classList.add("active")});
document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify({data:data(),machines:machines(),settings:load(SK,{rest:90})},null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`gym-log-${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById("clear").onclick=()=>{if(confirm("全履歴を削除しますか？")){localStorage.removeItem(DK);render()}};
let wl=null;document.getElementById("wake").onclick=async()=>{let b=document.getElementById("wake");try{if(wl){await wl.release();wl=null;b.textContent="画面を保持"}else if("wakeLock"in navigator){wl=await navigator.wakeLock.request("screen");b.textContent="保持中"}}catch{}};
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();tick();setInterval(tick,500);
</script></body></html>
